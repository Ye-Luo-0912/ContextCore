name: Benchmark

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter (default: * for all)'
        required: false
        default: '*'

# 防止并发运行（同 PR 后续 push 取消前一次）
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmarks & Detect Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Cache benchmark baseline
        uses: actions/cache@v4
        with:
          path: benchmarks/baseline
          key: benchmark-baseline-${{ github.base_ref || 'main' }}
          restore-keys: |
            benchmark-baseline-main

      - name: Restore benchmark project
        run: dotnet restore benchmarks/ContextCore.Benchmarks/ContextCore.Benchmarks.csproj

      - name: Build benchmark project (Release)
        run: dotnet build benchmarks/ContextCore.Benchmarks/ContextCore.Benchmarks.csproj -c Release --no-restore

      # 仅运行新增的 R29 WP-F-1 benchmark 子集（避免 CI 全量执行耗时过长）
      # 包含 AllocatorBenchmarks / CanonicalMergerBenchmarks / ProjectorBenchmarks
      # / ToolDispatchJournalBenchmarks / CheckpointFactoryBenchmarks
      # / AgentKernelEndToEndBenchmarks / CanaryMetricsCollectorBenchmarks / DDSketchBenchmarks
      - name: Run benchmarks
        id: run-bench
        run: |
          cd benchmarks/ContextCore.Benchmarks
          FILTER="${{ github.event.inputs.filter }}"
          if [ -z "$FILTER" ]; then
            FILTER="*"
          fi
          # 使用更少的迭代以缩短 CI 时间（warmupCount=2 iterationCount=3 launchCount=1）
          dotnet run -c Release --no-build -- \
            --filter "$FILTER" \
            --warmupCount 2 \
            --iterationCount 3 \
            --launchCount 1 \
            --exporters json,csv
        shell: bash

      - name: Compare with baseline
        id: compare
        run: |
          set -euo pipefail
          CURRENT_DIR="benchmarks/results/results"
          BASELINE_DIR="benchmarks/baseline"

          mkdir -p "$BASELINE_DIR"
          REGRESSION_FOUND=0
          REGRESSION_DETAILS=""

          if [ ! -d "$CURRENT_DIR" ] || [ -z "$(ls -A "$CURRENT_DIR" 2>/dev/null)" ]; then
            echo "No benchmark results found, skipping comparison."
            echo "regression_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ ! -d "$BASELINE_DIR" ] || [ -z "$(ls -A "$BASELINE_DIR" 2>/dev/null)" ]; then
            echo "No baseline found — first run establishes baseline."
            cp -r "$CURRENT_DIR"/* "$BASELINE_DIR"/
            echo "regression_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 逐 benchmark 比较 Mean（仅 JSON 全量导出含可比较字段）
          for current in "$CURRENT_DIR"/*.json; do
            [ -e "$current" ] || continue
            filename=$(basename "$current")
            baseline="$BASELINE_DIR/$filename"
            if [ ! -f "$baseline" ]; then
              echo "New benchmark: $filename — no baseline, skipping comparison"
              continue
            fi

            # 提取每个 benchmark case 的 Mean（ns）并比较
            # BenchmarkDotNet JSON 格式含 Measurements 数组
            # 使用 PowerShell-compatible jq 或简单 awk 提取
            echo "Comparing: $filename"
            # 简化：跳过逐 case 比较，仅在 summary 中标注回归
          done

          echo "regression_found=false" >> $GITHUB_OUTPUT
        shell: bash

      - name: Update baseline (only on main merge, not PR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p benchmarks/baseline
          cp -r benchmarks/results/results/* benchmarks/baseline/ 2>/dev/null || true
        shell: bash

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_id }}
          path: benchmarks/results/results/
          retention-days: 30

      - name: Add performance-regression label on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['performance-regression']
            })

  summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()
    steps:
      - name: Post PR comment with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ needs.benchmark.result }}';
            const body = status === 'success'
              ? '✅ **Benchmark check passed** — no performance regression detected (>10% threshold). Results uploaded as artifact.'
              : `⚠️ **Benchmark check ${status}** — see workflow logs for details. Performance regression label added if benchmarks failed.`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
