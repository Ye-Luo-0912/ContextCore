name: Benchmark (PR gate)

# PR 短门禁：仅运行稳定的 CPU/内存 benchmark 子集，与 main 基线对比，10% 阈值，失败阻止合并。
# 完整基准（main push）由 benchmark-main.yml 负责；本 workflow 不更新 baseline cache。
on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmark-pr.yml'
      - 'scripts/benchmark-compare.sh'
  workflow_dispatch:
    inputs:
      filter:
        description: 'BenchmarkDotNet filter (default: stable CPU/memory subset)'
        required: false
        default: ''

concurrency:
  group: benchmark-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PR 门禁环境：与生产 steady-state 一致的 JIT 配置（Tiered Compilation + Tiered PGO 开启）。
# 与 benchmark-main.yml 保持一致，确保 PR 与 main 基线测量口径相同。
# 注意：PR 在 GitHub-hosted runner 上运行，绝对性能受 runner 噪声影响，但 Tiered PGO 必须开启以反映生产 JIT 行为。
env:
  DOTNET_TieredCompilation: '1'
  DOTNET_TieredPGO: '1'
  DOTNET_ReadyToRun: '1'
  DOTNET_gcServer: '1'
  DOTNET_gcConcurrent: '1'
  # PR 门禁阈值：latency 10% / p95 15% / alloc 5%（脚本默认值，显式设置以稳定可重复）
  LATENCY_THRESHOLD_PCT: '10'
  P95_THRESHOLD_PCT: '15'
  ALLOCATION_THRESHOLD_PCT: '5'
  # PR 门禁拒绝"无基线即通过"假阴性
  REQUIRE_BASELINE: '1'

jobs:
  benchmark:
    name: PR benchmark gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      regression_found: ${{ steps.compare.outputs.regression_found }}
      compare_rc: ${{ steps.compare.outputs.compare_rc }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # 仅恢复最新 main 基线（不保存，避免 PR 污染基线缓存）
      - name: Restore benchmark baseline (read-only)
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: benchmarks/baseline
          # key 唯一不匹配任何已存缓存 → 总是回退到 restore-keys 恢复最新 main 基线
          key: benchmark-baseline-restore-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-main-

      # 修复：cache 缺失时不应视为通过。校验 cache hit 后基线完整性：
      # 目录非空 + 至少一个 *-report-full.json + 每个文件非空 + JSON 合法。
      # 此处校验是脚本内 REQUIRE_BASELINE 校验的前置防御层（脚本在 PR 模式下也会拒绝）。
      - name: Verify baseline integrity
        if: always()
        run: |
          set -e
          if [ ! -d benchmarks/baseline ] || [ -z "$(ls -A benchmarks/baseline 2>/dev/null)" ]; then
            echo "::error::Baseline cache miss — 目录为空或不存在。PR 门禁拒绝通过（REQUIRE_BASELINE=1）。请先在 main 运行 benchmark-main.yml 生成基线。"
            exit 1
          fi
          found=0
          for f in benchmarks/baseline/*-report-full.json; do
            [ -f "$f" ] || continue
            found=1
            if [ ! -s "$f" ]; then
              echo "::error::Baseline file is empty: $f"
              exit 1
            fi
            if ! jq empty "$f" >/dev/null 2>&1; then
              echo "::error::Baseline file is not valid JSON: $f"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No *-report-full.json baseline files found in benchmarks/baseline/"
            exit 1
          fi
          echo "✅ Baseline integrity verified: $found file(s) present and valid JSON."
        shell: bash

      # 新增：环境指纹记录 CPU / Runner / Runtime / JIT 配置，附加到 baseline 报告。
      # 这些信息用于解释回归测量值差异（如 runner 不同 → 绝对值不同但 CaseKey 一致仍可对比）。
      - name: Record environment fingerprint
        run: |
          mkdir -p benchmarks/results/results
          if [ -f /proc/cpuinfo ]; then
            CPU=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs)
          else
            CPU=$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name' 2>/dev/null | tr -d '\r' || echo "unknown")
          fi
          DOTNET_VER=$(dotnet --version)
          {
            echo "{"
            echo "  \"runner\": \"${{ runner.name }}\","
            echo "  \"os\": \"${{ runner.os }}\","
            echo "  \"arch\": \"${{ runner.arch }}\","
            echo "  \"cpu\": \"$CPU\","
            echo "  \"dotnet\": \"$DOTNET_VER\","
            echo "  \"tieredCompilation\": \"${DOTNET_TieredCompilation}\","
            echo "  \"tieredPGO\": \"${DOTNET_TieredPGO}\","
            echo "  \"readyToRun\": \"${DOTNET_ReadyToRun}\""
            echo "}"
          } > benchmarks/results/results/environment.json
          echo "## Benchmark Environment Fingerprint" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Runner**: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "- **CPU**: $CPU" >> $GITHUB_STEP_SUMMARY
          echo "- **.NET SDK**: $DOTNET_VER" >> $GITHUB_STEP_SUMMARY
          echo "- **DOTNET_TieredCompilation**: ${DOTNET_TieredCompilation}" >> $GITHUB_STEP_SUMMARY
          echo "- **DOTNET_TieredPGO**: ${DOTNET_TieredPGO}" >> $GITHUB_STEP_SUMMARY
          echo "- **DOTNET_ReadyToRun**: ${DOTNET_ReadyToRun}" >> $GITHUB_STEP_SUMMARY
        shell: bash

      - name: Restore benchmark project
        run: dotnet restore benchmarks/ContextCore.Benchmarks/ContextCore.Benchmarks.csproj

      - name: Build benchmark project (Release)
        run: dotnet build benchmarks/ContextCore.Benchmarks/ContextCore.Benchmarks.csproj -c Release --no-restore

      # 仅运行稳定 CPU/内存 bound benchmark 子集（避开 I/O 噪声 / ONNX 运行时 / 并发 scaling）。
      # 这些 case 在 GitHub-hosted runner 上变异小，可作为 PR 阻塞门禁。
      # 完整基准由 benchmark-main.yml 在 self-hosted runner 上运行。
      - name: Run benchmarks (stable subset, MinIterationCount=15)
        run: |
          cd benchmarks/ContextCore.Benchmarks
          FILTER="${{ github.event.inputs.filter }}"
          if [ -z "$FILTER" ]; then
            # 稳定子集：CPU/memory bound，无 I/O、无 ONNX、无并发 scaling
            FILTER="*CanaryMetricsBenchmarks|*CacheChurnBenchmarks|*DecisionEngineBenchmarks|*AgentKernelBenchmarks"
          fi
          # MinIterationCount=15 由 BenchmarkOutputConfig 集中配置（不覆盖 CLI）。
          # --launchCount 1 减少进程启动开销。
          dotnet run -c Release --no-build -- \
            --filter "$FILTER" \
            --launchCount 1 \
            --exporters json,csv
        shell: bash

      # 修复：传播脚本返回码。
      # 原实现 `set +e` + `rc=$?` 捕获后未传播，脚本退出码 2/3/4 会被静默吞掉导致假通过。
      # 现实现：捕获 rc 提取 regression_found 输出，最后 `exit $rc` 强制非零退出码传播给 Job。
      # 退出码语义：0=无回归；1=检测到回归；2=输入错误；3=基线缺失；4=基线损坏。
      - name: Compare with baseline
        id: compare
        if: success()
        run: |
          set +e
          bash scripts/benchmark-compare.sh benchmarks/results/results benchmarks/baseline > /tmp/compare.out 2>&1
          rc=$?
          cat /tmp/compare.out
          echo "compare_rc=$rc" >> $GITHUB_OUTPUT
          if grep -q 'regression_found=true' /tmp/compare.out; then
            echo "regression_found=true" >> $GITHUB_OUTPUT
          elif [ "$rc" -ne 0 ]; then
            # 非零 rc 但未输出 regression_found=true（输入错误/基线缺失/基线损坏）→ 视为失败
            echo "regression_found=unknown" >> $GITHUB_OUTPUT
          else
            echo "regression_found=false" >> $GITHUB_OUTPUT
          fi
          # 对比详情供 summary step 引用
          {
            echo "DETAIL<<EOF"
            cat /tmp/compare.out
            echo "EOF"
          } >> $GITHUB_ENV
          # 关键：传播返回码，非零退出码必须导致 Job 失败
          exit $rc
        shell: bash

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-pr-results-${{ github.run_id }}
          path: |
            benchmarks/results/results/
            benchmarks/baseline/
          retention-days: 14

      - name: Add performance-regression label
        if: always() && steps.compare.outputs.regression_found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: ['performance-regression']
            });

      - name: Post PR comment with summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const reg = '${{ steps.compare.outputs.regression_found }}' === 'true';
            const rc = '${{ steps.compare.outputs.compare_rc }}';
            const status = '${{ job.status }}';
            const gates = 'gates: latency>10% p95>15% alloc>5% | noise suppress: floor=3% minN=5 conf=2xStdErr io=30% | JIT: TieredCompilation=1 TieredPGO=1 ReadyToRun=1';
            let body;
            if (reg) {
              body = `⛔ **Performance regression detected** — ${gates}. See benchmark job logs. Label \`performance-regression\` added.`;
            } else if (status !== 'success') {
              body = `⚠️ **Benchmark gate ${status}** (compare rc=${rc}) — see workflow logs for details (may be infrastructure failure or baseline cache miss, not a regression).`;
            } else {
              body = `✅ **Benchmark PR gate passed** — no performance regression (${gates}). Results uploaded as artifact.`;
            }
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
